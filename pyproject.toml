[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestaltx"
version = "0.1.0"
description = "GestaltX iterative document research agent for SLIIT Codefest 2026 Sub-track 1C"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]
